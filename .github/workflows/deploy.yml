name: CI/CD Pipeline (Build GHCR & Deploy VPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${SSH_PORT:-22}"
          ssh -v -o StrictHostKeyChecking=no -p "$PORT" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "=== Memulai proses deploy di VPS ==="
            cd /opt/mainpage
            
            echo "-> Mengambil update repository..."
            git pull origin main
            
            echo "-> Menarik image terbaru dari GHCR..."
            docker compose pull app
            
            echo "-> Menjalankan ulang container app..."
            docker compose up -d app
            
            echo "-> Membersihkan image lama..."
            docker image prune -f
            
            echo "=== Deployment berhasil! ==="
          EOF
